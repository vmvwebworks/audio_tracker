name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache SoundFont
        uses: actions/cache@v6
        with:
          path: assets/GeneralUser-GS.sf2
          key: soundfont-${{ hashFiles('scripts/setup.ps1') }}
      - name: Setup
        shell: pwsh
        run: scripts/setup.ps1
      - name: Check (gofmt, vet, test, build)
        shell: pwsh
        run: scripts/check.ps1

  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'sin-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Code changes need a CHANGELOG entry
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          code=$(echo "$changed" | grep -E '\.go$' | grep -v '_test\.go$' || true)
          if [ -n "$code" ] && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Este PR cambia código Go pero no CHANGELOG.md. Añade una línea en «Sin publicar» (y actualiza docs/ si corresponde). Si de verdad no hace falta, pon la etiqueta sin-changelog."
            echo "$code"
            exit 1
          fi

  # main can't be protected on a free private repo, so at least flag commits
  # that reached it without a pull request.
  via-pr:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Changes reach main through a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq length)
          if [ "$n" = "0" ]; then
            echo "::error::Push directo a main sin PR (${{ github.sha }}). Trabaja en una rama y abre un PR: ver CONTRIBUTING.md."
            exit 1
          fi
